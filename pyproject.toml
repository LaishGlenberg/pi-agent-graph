[project]
name = "pi-agent-graph"
version = "0.1.0"
description = "Build and launch multi-agent pi workflows"
readme = "README.md"
authors = [
    { name = "LaishGlenberg", email = "lglenbe1@asu.edu" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pi-agent-graph = "pi_agent_graph:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
